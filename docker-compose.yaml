services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "8888:3000"
    restart: unless-stopped
    # Должен быть больше SHUTDOWN_TIMEOUT_MS (см. .env, по умолчанию 15с) -
    # иначе Docker пошлёт SIGKILL раньше, чем приложение успеет
    # дождаться старта/уже начатых игровых операций и корректно закрыть
    # Postgres. Настраивается через STOP_GRACE_PERIOD в .env - см.
    # .env.example. Compose-синтаксис длительности (например "20s"), а не
    # миллисекунды - единицы SHUTDOWN_TIMEOUT_MS и STOP_GRACE_PERIOD не
    # конвертируются друг в друга автоматически, следите за соответствием
    # сами при изменении любого из двух.
    stop_grace_period: ${STOP_GRACE_PERIOD:-20s}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
