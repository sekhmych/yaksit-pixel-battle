version: '3.8'

services:
  # Наша база данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: pixel-battle-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: supersecretpassword # Замените на надежный пароль
      POSTGRES_DB: pixelbattle
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Наш Node.js сервер с WebSockets
  app:
    image: node:20-alpine
    container_name: pixel-battle-app
    working_dir: /app
    command: sh -c "npm install express socket.io pg cors && node server.js"
    environment:
      - DB_USER=admin
      - DB_PASSWORD=supersecretpassword
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=pixelbattle
      - ADMIN_PASSWORD=supersecretadmin123 # <-- Пароль для входа в админку
    ports:
      - "8080:3000"
    volumes:
      - ./backend:/app
      - ./html:/app/public
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata: