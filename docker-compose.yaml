version: '3.8'

services:
  # Наша база данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: pixel-battle-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: supersecretpassword # Замените на надежный пароль
      POSTGRES_DB: pixelbattle
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Проброс локального init.sql удален ради безопасности деплоя
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Наш Node.js сервер с WebSockets
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: pixel-battle-app
    environment:
      - DB_USER=admin
      - DB_PASSWORD=supersecretpassword
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=pixelbattle
      - ADMIN_PASSWORD=supersecretadmin123
    ports:
      - "8080:3000"
    # Блок volumes удален: код теперь внутри образа, а не пробрасывается с сервера
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata: # Разрешенный именованный том для хранения данных БД