version: '3.8'

services:
  # Наш Node.js сервер с WebSockets
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: pixel-battle-app
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    ports:
      - "8080:${PORT:-3000}"
    depends_on:
      - db
    restart: unless-stopped

  # Наша база данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: pixel-battle-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    restart: unless-stopped
