<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив раундов | Подслушано ЯКСИТ x Pixel Battle by Hamaanda</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
    <link rel="stylesheet" href="/tailwind.css">
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="max-w-5xl mx-auto p-4 sm:p-8">
        <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-xl sm:text-2xl font-bold text-blue-400 uppercase tracking-widest">🗂️ Архив раундов</h1>
            <a href="/" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg transition text-sm">К холсту</a>
        </div>

        <div id="list-view">
            <div id="rounds-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
            <div id="empty-state" class="hidden text-center py-20 text-gray-500 italic">Пока нет завершённых раундов.</div>
            <div id="loading-state" class="text-center py-20 text-gray-500">Загрузка…</div>
        </div>

        <div id="detail-view" class="hidden">
            <button id="btn-back" class="mb-4 px-3 py-1.5 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm">&larr; Ко всем раундам</button>
            <div class="bg-gray-800 border border-gray-700 rounded-2xl p-4 sm:p-6 space-y-4">
                <div>
                    <h2 id="detail-name" class="text-xl sm:text-2xl font-bold text-white"></h2>
                    <p id="detail-description" class="text-gray-400 text-sm mt-1"></p>
                </div>
                <div id="detail-meta" class="flex flex-wrap gap-x-6 gap-y-1 text-xs text-gray-500 font-mono"></div>
                <div class="flex justify-center bg-black/40 rounded-xl border border-gray-700 p-4">
                    <img id="detail-image" class="max-w-full rounded-lg shadow-2xl" style="image-rendering: pixelated;" alt="Финальный холст раунда">
                </div>
                <div class="flex flex-wrap gap-3 justify-center">
                    <button id="btn-copy-link" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold text-sm shadow-lg">🔗 Скопировать ссылку</button>
                    <a id="btn-download" download class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg font-bold text-sm shadow-lg">📥 Скачать PNG</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const listView = document.getElementById('list-view');
        const detailView = document.getElementById('detail-view');
        const grid = document.getElementById('rounds-grid');
        const emptyState = document.getElementById('empty-state');
        const loadingState = document.getElementById('loading-state');

        function fmt(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleString();
        }

        function roundCard(round) {
            const a = document.createElement('a');
            a.href = `/archive/${round.id}`;
            a.className = 'block bg-gray-800 border border-gray-700 rounded-2xl overflow-hidden hover:border-blue-500/60 transition shadow-lg group';
            a.dataset.id = round.id;
            a.addEventListener('click', (e) => { e.preventDefault(); showDetail(round.id); history.pushState({}, '', `/archive/${round.id}`); });

            const imgWrap = document.createElement('div');
            imgWrap.className = 'aspect-square bg-black flex items-center justify-center overflow-hidden';
            const img = document.createElement('img');
            img.src = round.has_preview ? `/api/rounds/archive/${round.id}/preview.png` : '';
            img.alt = round.name;
            img.className = 'w-full h-full object-contain group-hover:scale-105 transition-transform';
            img.style.imageRendering = 'pixelated';
            imgWrap.appendChild(img);

            const info = document.createElement('div');
            info.className = 'p-3 sm:p-4';
            const title = document.createElement('div');
            title.className = 'font-bold text-white truncate';
            title.textContent = round.name;
            const meta = document.createElement('div');
            meta.className = 'text-[11px] text-gray-500 mt-1 font-mono';
            meta.textContent = `${fmt(round.finished_at)} · ${round.canvas_size}x${round.canvas_size} · ${round.pixel_count} px`;

            info.append(title, meta);
            a.append(imgWrap, info);
            return a;
        }

        async function loadList() {
            loadingState.classList.remove('hidden');
            emptyState.classList.add('hidden');
            try {
                const res = await fetch('/api/rounds/archive');
                const data = await res.json();
                grid.innerHTML = '';
                if (!data.rounds || data.rounds.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    data.rounds.forEach(r => grid.appendChild(roundCard(r)));
                }
            } catch (e) {
                emptyState.classList.remove('hidden');
                emptyState.textContent = 'Не удалось загрузить архив.';
            } finally {
                loadingState.classList.add('hidden');
            }
        }

        async function showDetail(id) {
            listView.classList.add('hidden');
            detailView.classList.remove('hidden');
            try {
                const res = await fetch(`/api/rounds/archive/${id}`);
                if (!res.ok) throw new Error('not found');
                const data = await res.json();
                const round = data.round;
                document.getElementById('detail-name').textContent = round.name;
                document.getElementById('detail-description').textContent = round.description || '';
                document.getElementById('detail-meta').innerHTML = '';
                const metaItems = [
                    `Начало: ${fmt(round.starts_at)}`,
                    `Окончание: ${fmt(round.ends_at)}`,
                    `Завершён: ${fmt(round.finished_at)}`,
                    `Холст: ${round.canvas_size}x${round.canvas_size}`,
                    `Пикселей: ${round.pixel_count}`
                ];
                const metaEl = document.getElementById('detail-meta');
                metaItems.forEach(t => {
                    const span = document.createElement('span');
                    span.textContent = t;
                    metaEl.appendChild(span);
                });

                const previewUrl = `/api/rounds/archive/${id}/preview.png`;
                document.getElementById('detail-image').src = round.has_preview ? previewUrl : '';
                document.getElementById('btn-download').href = previewUrl;
                document.getElementById('btn-download').download = `pixel-battle-round-${id}.png`;

                document.getElementById('btn-copy-link').onclick = async () => {
                    const link = `${location.origin}/archive/${id}`;
                    try {
                        await navigator.clipboard.writeText(link);
                        const btn = document.getElementById('btn-copy-link');
                        const original = btn.textContent;
                        btn.textContent = '✅ Скопировано';
                        setTimeout(() => { btn.textContent = original; }, 1500);
                    } catch (e) {
                        prompt('Скопируйте ссылку:', link);
                    }
                };
            } catch (e) {
                detailView.innerHTML = '<p class="text-center text-gray-500 py-20">Раунд не найден в архиве.</p>';
            }
        }

        document.getElementById('btn-back').addEventListener('click', () => {
            detailView.classList.add('hidden');
            listView.classList.remove('hidden');
            history.pushState({}, '', '/archive');
        });

        window.addEventListener('popstate', boot);

        function boot() {
            const match = location.pathname.match(/^\/archive\/(\d+)\/?$/);
            if (match) {
                showDetail(match[1]);
            } else {
                detailView.classList.add('hidden');
                listView.classList.remove('hidden');
                loadList();
            }
        }

        boot();
    </script>
</body>
</html>
