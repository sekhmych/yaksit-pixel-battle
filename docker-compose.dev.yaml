services:
  db:
    image: postgres:15-alpine
    container_name: pixel-battle-db-dev
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: development_only_change_me
      POSTGRES_DB: pixelbattle
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  app:
    image: node:20-alpine
    container_name: pixel-battle-app-dev
    working_dir: /app
    command: sh -c "npm ci && node --watch server.js"
    environment:
      NODE_ENV: development
      DB_USER: admin
      DB_PASSWORD: development_only_change_me
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pixelbattle
      ADMIN_PASSWORD: development_only_change_me
      SESSION_SECRET: development_only_change_me_replace_before_public_use
      CORS_ORIGINS: http://localhost:8080
      PORT: 3000
    ports:
      - "8080:3000"
    volumes:
      - ./backend:/app
      - ./html:/app/public
      - backend_node_modules:/app/node_modules
    depends_on:
      - db

volumes:
  pgdata:
  backend_node_modules:
